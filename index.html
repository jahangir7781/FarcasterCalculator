<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farcaster Calculator</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 50px; }
    input { width: 200px; font-size: 20px; padding: 5px; text-align: right; }
    button { width: 50px; height: 50px; font-size: 18px; margin: 2px; }
  </style>
</head>
<body>
  <h2>Simple Calculator</h2>
  <input type="text" id="display" readonly />
  <div>
    <button onclick="press('7')">7</button>
    <button onclick="press('8')">8</button>
    <button onclick="press('9')">9</button>
    <button onclick="press('/')">/</button><br>
    <button onclick="press('4')">4</button>
    <button onclick="press('5')">5</button>
    <button onclick="press('6')">6</button>
    <button onclick="press('*')">*</button><br>
    <button onclick="press('1')">1</button>
    <button onclick="press('2')">2</button>
    <button onclick="press('3')">3</button>
    <button onclick="press('-')">-</button><br>
    <button onclick="press('0')">0</button>
    <button onclick="press('.')">.</button>
    <button onclick="clearDisplay()">C</button>
    <button onclick="press('+')">+</button><br>
    <button onclick="calculate()" style="width: 210px; background-color: #4CAF50; color: white;">=</button>
  </div>

  <script>
    let display = document.getElementById('display');
    function press(value) { display.value += value; }
    function clearDisplay() { display.value = ''; }
    function calculate() {
      try { display.value = eval(display.value); } 
      catch { display.value = 'Error'; }
    }
  </script>
</body>
</html>
